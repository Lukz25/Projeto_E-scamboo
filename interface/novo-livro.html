<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Novo livro · E-scamboo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Lora:ital,wght@0,500;0,600;0,700;1,500;1,700&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tema.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div style="min-height:100%">

  <header class="top" id="topo"></header>

  <main class="page page-form">
    <div class="hd">
      <a href="livros.html">← Voltar para Livros</a>
      <h1>Novo livro</h1>
    </div>

    <p id="msg" class="msg" hidden></p>

    <form class="card form" id="form-livro">
      <p class="muted">O livro entra na biblioteca de <strong style="color:#2b2417" id="nome-dono"></strong>, o usuário logado.</p>

      <div class="form-body">
        <div class="form-main">
          <label class="fld fld-single">Título
            <input class="inp" type="text" id="nome" placeholder="Ex.: Dom Casmurro" required>
          </label>

          <div class="pair">
            <div class="fld">
              <span id="lbl-autores">Autor(es)</span>
              <div class="multi" id="caixa-autores" role="group" aria-labelledby="lbl-autores"></div>
              <select class="inp add-sel" id="add-autor" aria-label="Adicionar autor"></select>
              <span class="hint">Não achou? <a href="autores.html">Cadastrar novo autor</a></span>
            </div>
            <div class="fld">
              <span id="lbl-generos">Gênero(s)</span>
              <div class="multi" id="caixa-generos" role="group" aria-labelledby="lbl-generos"></div>
              <select class="inp add-sel" id="add-genero" aria-label="Adicionar gênero"></select>
              <span class="hint">Não achou? <a href="generos.html">Cadastrar novo gênero</a></span>
            </div>
          </div>

          <div class="pair">
            <label class="fld">Data de lançamento
              <input class="inp" type="text" id="data" placeholder="Ex.: 1899 ou VIII a.C.">
            </label>
            <label class="fld">Estado de conservação
              <select class="inp" id="estado"><option value="">Selecione</option><option>novo</option><option>bom</option><option>regular</option><option>desgastado</option></select>
            </label>
          </div>

          <label class="fld fld-single">Descrição <span class="hint">(opcional)</span>
            <textarea class="inp inp-area" rows="4" id="descricao" placeholder="Ex.: Edição de bolso, capa dura, páginas grifadas…"></textarea>
          </label>
        </div>
      </div>

      <div class="form-actions">
        <a class="btn btn-lg" href="livros.html">Cancelar</a>
        <button type="submit" class="btn btn-p btn-lg">Salvar livro</button>
      </div>
    </form>
  </main>

</div>
<script src="js/comum.js"></script>
<script src="js/livro-form.js"></script>
<script>iniciarFormularioLivro(null);</script>
</body>
</html>
